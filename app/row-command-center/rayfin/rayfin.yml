id: row-command-center
name: row-command-center
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://full-wave-85c537f2c9-westus3.webapp.fabricapps.net
  data:
    enabled: false
  storage:
    enabled: false
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  functions:
    enabled: false
connectors:
  - name: row_pbi_poc
    config:
      workspaceId: 964345ef-fc6a-48f6-b58a-51ff6d5d60e9
      itemId: 2d1846aa-bb70-416a-a6d4-0b89c8a2058a
    auth:
      type: delegated
    version: "1"
    operations:
      - name: executeQuery
    type: fabric-semanticmodel
  - name: row-tracker
    type: fabric-sqldatabase
    config:
      workspaceId: 964345ef-fc6a-48f6-b58a-51ff6d5d60e9
      itemId: b20ebf8c-cc8b-4a5d-8a85-4a92b359da7e
    # Category A defaults to application identity; this app runs every data-source
    # call as the signed-in user (per-user access + server-pinned changed_by).
    auth:
      type: delegated
    operations:
      - name: read
      - name: create
      - name: update
